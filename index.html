<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OPN Guestbook</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>

    body{
      background:#090912;
      color:white;
      font-family:Arial,sans-serif;
      text-align:center;
      padding-top:50px;
    }

    .card{
      width:90%;
      max-width:500px;
      margin:auto;
      background:#151524;
      padding:30px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(140,0,255,.25);
    }

    h1{
      color:#9d6bff;
    }

    input{
      width:90%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-top:20px;
    }

    button{
      margin-top:15px;
      padding:12px 20px;
      border:none;
      border-radius:10px;
      background:#7c4dff;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    #status{
      margin-top:20px;
      opacity:.8;
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>OPN Guestbook ⚡</h1>

    <p>
      Community guestbook smart contract built on OPN Chain.
    </p>

    <p>
      Creator: malamsunyi94
    </p>

    <button onclick="connectWallet()">
      Connect Wallet
    </button>

    <br>

    <input
      type="text"
      id="messageInput"
      placeholder="Write your message..."
    />

    <br>

    <button onclick="sendMessage()">
      Send Message
    </button>

    <p id="status">
      Builder Pass Claimed ✅
    </p>

    <p>
      Accelerate ⋂
    </p>

  </div>

<script>

const contractAddress =
"0xF339E39c96df9Ca92145123604EEca69C156cd01";

const abi = [
  "function leaveMessage(string memory _text) public",
  "function totalMessages() public view returns(uint256)"
];

let provider;
let signer;
let contract;

function getEthereumProvider() {

  if (window.ethereum?.providers?.length) {

    return window.ethereum.providers.find(
      p => p.isMetaMask
    ) || window.ethereum.providers[0];

  }

  return window.ethereum;
}

async function connectWallet() {

  try {

    const ethProvider = getEthereumProvider();

    if (!ethProvider) {

      alert(
        "Wallet not detected. Open this site inside MetaMask, OKX, Bitget, Trust Wallet, or another Web3 wallet browser."
      );

      return;
    }

    provider =
      new ethers.providers.Web3Provider(
        ethProvider,
        "any"
      );

    await provider.send(
      "eth_requestAccounts",
      []
    );

    signer = provider.getSigner();

    contract = new ethers.Contract(
      contractAddress,
      abi,
      signer
    );

    const address =
      await signer.getAddress();

    document.getElementById("status")
      .innerText =
      "Connected: " +
      address.slice(0,6) +
      "..." +
      address.slice(-4);

  } catch (error) {

    alert(
      "Connect failed: " +
      error.message
    );

  }
}

async function sendMessage() {

  try {

    if (!contract) {

      alert("Connect wallet first");

      return;
    }

    const message =
      document.getElementById(
        "messageInput"
      ).value;

    if (!message) {

      alert("Enter a message first");

      return;
    }

    const tx =
      await contract.leaveMessage(
        message
      );

    document.getElementById("status")
      .innerText =
      "Transaction pending...";

    await tx.wait();

    document.getElementById("status")
      .innerText =
      "Message sent ✅";

  } catch (error) {

    alert(
      "Transaction failed: " +
      error.message
    );

  }
}

</script>

</body>
</html>
